<!DOCTYPE html>
<html>
<head>

        }

            font-weight: bold;

        }
        .alt-button {

            margin: 20px 0;

            letter-spacing: 3px;
        }
        .debug {
            margin-top: 30px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .note {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }
        .copy-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #1C8376;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 14px;
        }
        #statusMessage {
            padding: 8px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

        <div class="code" id="codeDisplay">46610</div>
        <button class="copy-btn" id="copyBtn">Copy Code</button>
        
        <div id="statusMessage"></div>
        
        <p>Tap a button to open the TotL app:</p>

        <div class="debug" id="debugInfo">Loading...</div>
    </div>

    <script>
        // Parse the URL to get the join code
        function getJoinCodeFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            let code = urlParams.get('code');
            // Also check for joinCode
            if (!code) {
                code = urlParams.get('joinCode');
            }
            return code || '46610'; // Default code if none specified
        }
        
        // Get delay parameter or use default
        function getDelayParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const delay = urlParams.get('delay');
            return delay ? parseFloat(delay) : 1.0; // Default to 1.0 second
        }
        
        // Check if app is installed and handle redirect failures
        function attemptRedirect(url, fallbackUrl) {
            // Record start time
            const startTime = new Date().getTime();
            
            // Set a timeout to check if we're still on this page after a short delay
            setTimeout(function() {
                const currentTime = new Date().getTime();
                // If we're still here after 2 seconds, app probably isn't installed
                if (document.hidden || document.webkitHidden) {
                    logToDebug("App appears to have opened successfully");
                } else if (currentTime - startTime < 2000) {
                    logToDebug("Still on webpage - app may not be installed or couldn't handle the URL");
                    if (fallbackUrl) {
                        logToDebug("Trying fallback URL: " + fallbackUrl);
                        window.location.href = fallbackUrl;
                    }
                }
            }, 2000);
            
            // Attempt to open the app
            window.location.href = url;
        }

        function logToDebug(message) {
            const debugInfo = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            debugInfo.innerHTML += `\n${timestamp}: ${message}`;
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }
